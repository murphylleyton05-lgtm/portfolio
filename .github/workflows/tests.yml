# Corre las pruebas de los proyectos de datos en cada push.
# Usan los parquets procesados que están commiteados (versión demo), así que no
# necesitan bajar datos ni red.
name: Tests

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install pandas numpy scipy pyarrow pytest

      - name: Operations Intelligence
        working-directory: vaca-muerta-ops-intelligence
        run: python -m pytest -q

      - name: Frac Logistics
        working-directory: frac-sand-fuel-logistics
        run: python -m pytest -q

      - name: Well Performance ML
        working-directory: well-performance-ml
        run: python -m pytest -q
