name: Deploy sitio (Landing + EchoNotes) a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: echonotes/package-lock.json
      - run: npm ci
        working-directory: echonotes
      - run: npm run build
        working-directory: echonotes
      - name: Ensamblar sitio (landing en raiz + EchoNotes en /echonotes)
        run: |
          mkdir -p site
          cp -r lleyton-ia-landing/* site/
          mkdir -p site/echonotes
          cp -r echonotes/dist/* site/echonotes/
          mkdir -p site/crm
          cp -r command-center/* site/crm/
          mkdir -p site/xelvia
          cp -r xelvia-dashboard/* site/xelvia/
          mkdir -p site/vuelto
          cp -r vuelto/* site/vuelto/
          mkdir -p site/vaca-muerta
          cp vaca-muerta-analytics/web/index.html site/vaca-muerta/
          # assets/ trae la imagen de preview (Open Graph) para compartir el link
          cp -r vaca-muerta-analytics/web/assets site/vaca-muerta/ 2>/dev/null || true
          mkdir -p site/logistica
          cp frac-sand-fuel-logistics/web/index.html site/logistica/
          mkdir -p site/performance
          cp well-performance-ml/web/index.html site/performance/
          mkdir -p site/operaciones
          cp vaca-muerta-ops-intelligence/web/index.html site/operaciones/
          mkdir -p site/hidrocarburos
          cp -r portfolio-hidrocarburos/* site/hidrocarburos/
          mkdir -p site/chat
          cp chatfolio/web/index.html site/chat/
          # Copia de la base de conocimiento al lado de la página: el chat la lee del mismo dominio, sin depender de GitHub raw.
          mkdir -p site/chat/conocimiento
          cp chatfolio/conocimiento/*.md site/chat/conocimiento/
      # Imagen de vista previa del Chatfolio (LinkedIn, WhatsApp): screenshot de og.html con el Chrome del runner.
      # Si falla, el sitio se publica igual (solo falta la imagen).
      - name: Imagen de vista previa del Chatfolio (og.png)
        continue-on-error: true
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npx -y playwright@1.56.1 screenshot --channel chrome --viewport-size "1200, 627" --wait-for-timeout 2500 "file://$PWD/chatfolio/web/og.html" site/chat/og.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
